name: nexsoft_server_shared
description: >
  Wire-contract types shared between the nexsoft_server backend and its
  nexsoft_server_website dashboard — one compiled definition instead of two
  hand-copied ones.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: 2.4.13
  freezed: 2.5.2
  json_serializable: 6.8.0
  lints: ^6.1.0
  test: ^1.26.3
